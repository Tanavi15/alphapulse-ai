services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  - type: web
    name: alphapulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true

  # ── Frontend (Static Site) ────────────────────────────────────────────────────
  - type: web
    name: alphapulse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://alphapulse-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://alphapulse-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
